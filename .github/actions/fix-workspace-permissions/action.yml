name: Fix workspace permissions
description: >
  Chowns the checkout back to the runner user. Needed because containers in
  the compose stack write into the workspace as root (bind mounts), leaving
  files the self-hosted runner's own user can't clean up on the next checkout.
runs:
  using: composite
  steps:
    - name: Fix workspace permissions
      shell: bash
      run: |
        docker run --rm \
          -v "$(pwd):/workspace" \
          alpine \
          chown -R "$(id -u):$(id -g)" /workspace
