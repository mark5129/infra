# Shared edge stack — nginx (TLS termination + reverse proxy) + certbot.
#
# Owned by neither project: every app on the box (portfolio, TravelPlanner,
# and any future project) attaches to this via the external networks below,
# by joining the matching `web-*` network in its own compose file. This
# replaces TravelPlanner's docker-compose.yml owning nginx/certbot directly,
# which made the portfolio site's TLS/routing a hidden TravelPlanner
# dependency.
#
# Reuses the exact networks/volumes TravelPlanner's compose already created
# (declared here as external) — no data migration, no new certs, no changes
# to any project's own containers. See infra/README.md for the cutover steps
# from TravelPlanner-owned nginx to this stack.
#
# --- TLS bootstrap (only if starting from scratch, no existing certs) ------
#   docker compose up -d nginx certbot
#   docker compose run --rm certbot certonly \
#     --webroot -w /var/www/certbot \
#     -d markusheuer.com -d www.markusheuer.com \
#     -d dev.markusheuer.com -d test.markusheuer.com \
#     --email markus.kaad.heuer@gmail.com --agree-tos --no-eff-email
#   docker compose up -d
# -----------------------------------------------------------------------------

services:
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../scripts/prod-nginx-init.sh:/docker-entrypoint.d/01-ensure-cert.sh
      - ./nginx-cert-reload-watcher.sh:/docker-entrypoint.d/02-cert-reload-watcher.sh
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt
    env_file: .env
    environment:
      # NGINX_ENVSUBST_FILTER prevents envsubst from clobbering nginx's own
      # $host, $uri, etc. – only $DOMAIN/$APP_DOMAIN are substituted at startup.
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|APP_DOMAIN)$$"
    networks:
      - web-prod
      - web-dev
      - web-test
      - web-portfolio
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 96M
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3

# ── Networks ──────────────────────────────────────────────────────────────────
# All external: true — created by TravelPlanner's compose project historically,
# now shared. Renaming/re-owning them is not required for the cutover.
networks:
  web-prod:
    external: true
    name: travelplanner_web-prod
  web-dev:
    external: true
    name: travelplanner_web-dev
  web-test:
    external: true
    name: travelplanner_web-test
  web-portfolio:
    external: true
    name: web-portfolio

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  certbot_webroot:
    external: true
    name: travelplanner_certbot_webroot
  certbot_certs:
    external: true
    name: travelplanner_certbot_certs
